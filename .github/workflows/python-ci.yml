name: Python CI

on:
  push:
    paths:
      - 'backend/**'
      - 'bff/**'
      - '.github/workflows/python-ci.yml'
      - 'ruff.toml'
      - 'pyproject.toml'
      - 'mypy.ini'
      - 'pytest.ini'
      - '.coveragerc'
      - 'linter.ini'

  pull_request:
    paths:
      - 'backend/**'
      - 'bff/**'
      - 'linter.ini'

      - '.github/workflows/python-ci.yml'

jobs:
  quality:
    name: Python quality gates (${{ matrix.service }} • py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, bff]
        python-version: ["3.11", "3.12"]

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff black mypy pytest pytest-cov bandit pip-audit

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (format check)
        run: black --check .

      - name: MyPy (types)
        run: mypy .

      - name: PyTest (coverage)
        run: pytest -q --cov=. --cov-report=term-missing

      - name: Bandit (security)
        run: bandit -q -r .

      - name: pip-audit (vulnerabilities)
        run: pip-audit --progress-spinner=off || true # advisory initially



  architecture:
    name: Architecture contracts (import-linter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install import-linter
        run: |
          python -m pip install --upgrade pip
          pip install import-linter

      - name: Enforce contracts (lint-imports)
        run: lint-imports -c linter.ini

  complexity-spotcheck:
    name: Complexity spot-check (C901) on refactored modules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Enforce C901 on select modules
        run: |
          ruff check \
            backend/services/streamer.py \
            backend/adapters/nautilus.py \
            backend/services/backtests.py \
            backend/api/routes/backtests.py \
            bff/services/backtest_aggregator.py \
            --select C901

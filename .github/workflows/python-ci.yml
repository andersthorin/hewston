name: Python CI

on:
  push:
    paths:
      - 'backend/**'
      - 'bff/**'
      - '.github/workflows/python-ci.yml'
      - 'ruff.toml'
      - 'pyproject.toml'
      - 'mypy.ini'
      - 'pytest.ini'
      - '.coveragerc'
      - 'linter.ini'

  pull_request:
    paths:
      - 'backend/**'
      - 'bff/**'
      - 'linter.ini'

      - '.github/workflows/python-ci.yml'

jobs:
  quality:
    name: Python quality gates (${{ matrix.service }} • py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, bff]
        python-version: ["3.11"]

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dev toolchain (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Show tool versions
        run: |
          python -V
          ruff --version
          black --version
          mypy --version
          pytest --version
          bandit --version
          pip-audit --version

      - name: Ruff (lint)
        run: ruff check backend bff

      - name: Black (format check)
        run: black --check backend bff

      - name: MyPy (types)
        run: mypy backend bff

      - name: PyTest (coverage - backend)
        if: matrix.service == 'backend'
        working-directory: .
        env:
          PYTHONPATH: .
        run: pytest -q backend/tests --cov=backend --cov-report=term-missing

      - name: PyTest (coverage - bff)
        if: matrix.service == 'bff'
        working-directory: .
        env:
          PYTHONPATH: .
        run: pytest -q bff/tests --cov=bff --cov-report=term-missing

      - name: Bandit (security)
        run: bandit -q -r . || true # advisory initially

      - name: pip-audit (vulnerabilities)
        run: pip-audit --progress-spinner=off || true # advisory initially



  architecture:
    name: Architecture contracts (import-linter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dev toolchain (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Show tool versions
        run: |
          python -V
          python - <<'PY'
import importlinter, grimp
print('import-linter', getattr(importlinter, '__version__', 'unknown'))
print('grimp', getattr(grimp, '__version__', 'unknown'))
PY

      - name: Enforce contracts (lint-imports)
        run: lint-imports --config linter.ini

  complexity-spotcheck:
    name: Complexity spot-check (C901) on refactored modules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Enforce C901 on select modules
        run: |
          ruff check \
            backend/services/streamer.py \
            backend/adapters/nautilus.py \
            backend/services/backtests.py \
            backend/api/routes/backtests.py \
            bff/services/backtest_aggregator.py \
            --select C901

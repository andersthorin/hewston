name: Frontend CI

on:
  push:
    paths:
      - 'frontend/**'
      - '.nvmrc'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.nvmrc'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint (app code)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run targeted tests
        run: |
          npm run test -- --run --reporter=dot src/components/__tests__/MetricsSummary.test.tsx
          npm run test -- --run --reporter=dot src/components/__tests__/StreamingMetricsPanel.test.tsx
          npm run test -- --run --reporter=dot src/components/__tests__/SymbolFocus.test.tsx
          npm run test -- --run --reporter=dot src/components/__tests__/TimelineScrubber.test.tsx
          npm run test -- --run --reporter=dot src/components/runs-table/RunsTable.test.tsx



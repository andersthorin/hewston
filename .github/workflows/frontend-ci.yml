name: Frontend CI

on:
  push:
    paths:
      - 'frontend/**'
      - '.nvmrc'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.nvmrc'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Type check (TypeScript)
        run: npm run type-check

      - name: Lint (components/containers/views)
        run: npm run lint

      - name: Lint (services/hooks/utils/store)
        run: npm run lint:services

      - name: Build
        run: npm run build

      - name: Unit tests (Vitest) with coverage
        run: npm run test -- --run --coverage --reporter=dot

      - name: Prettier check
        run: npm run prettier:check



line-length = 100
extend-exclude = [
  ".venv",
  "node_modules",
  "frontend/node_modules",
  "frontend/dist",
  "tmp_data_bff_debug",
]
# Target Python version for linting rules
target-version = "py311"

[lint]
select = [
  "E",  # pycodestyle
  "F",  # pyflakes
  "W",  # warnings
  "UP", # pyupgrade
  "B",  # bugbear (subset via Ruff)
]
# Temporarily ignore long lines, import-order and E402 until legacy is cleaned up
ignore = ["E501", "I001", "E402"]

[lint.per-file-ignores]
"backend/jobs/cli.py" = ["B008"]
"backend/jobs/materialize_bars.py" = ["E402"]

[lint.isort]
known-first-party = ["backend", "bff"]

[format]
quote-style = "single"


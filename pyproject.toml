[tool.black]
line-length = 100
target-version = ["py311"]
exclude = '''
/(\
  \.venv\
| node_modules\
| frontend\
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".venv",
  "node_modules",
  "frontend",
]

[tool.ruff.lint]
# High-signal rule packs:
# E/W/F: pycodestyle/pyflakes; I: import order; UP: modernization;
# B: bugbear; SIM: simplify; N: naming; D: docstrings;
# PL: pylint subset (readability/size); PT: pytest style;
# C90: cyclomatic complexity (mccabe)
select = ["E", "W", "F", "I", "UP", "B", "SIM", "N", "D", "PL", "PT", "C90"]
ignore = []

# Keep tests readable without forcing docstrings everywhere.
per-file-ignores = { "tests/**/*" = ["D"] }

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

# --- Optional: If you later switch from Black to Ruff's formatter, uncomment:
# [tool.ruff.format]
# quote-style = "double"
# line-ending = "lf"
# indent-style = "space"

# --- Static typing (recommended) ---
[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
pretty = true

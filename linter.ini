[linter]
# Analyze the codebase from the repository root.
root_path = .

# Contracts are deliberately minimal to start; we’ll expand once this bakes in.

[importlinter:contract:backend_bff_independence]
name = Backend and BFF must be independent
type = independence
modules =
    backend
    bff

[importlinter:contract:adapters_no_services]
name = backend.adapters must not depend on backend.services
type = forbidden
source_modules =
    backend.adapters
forbidden_modules =
    backend.services



[importlinter:contract:backend_api_forbid_adapters]
name = backend.api must not depend on backend.adapters
type = forbidden
source_modules =
    backend.api
forbidden_modules =
    backend.adapters

[importlinter:contract:backend_core_layers]
name = backend core layering (ports -> domain -> services)
type = layers
layers =
    backend.ports
    backend.domain
    backend.services

[importlinter:contract:backend_services_no_api]
name = backend.services must not depend on backend.api
type = forbidden
source_modules =
    backend.services
forbidden_modules =
    backend.api

[importlinter:contract:backend_adapters_no_api]
name = backend.adapters must not depend on backend.api
type = forbidden
source_modules =
    backend.adapters
forbidden_modules =
    backend.api

[importlinter:contract:bff_layers]
name = bff layering (models -> services -> api)
type = layers
layers =
    bff.models
    bff.services
    bff.api

